<script>
'use strict';

(function () {
  var E = window.VillageEngine || {};
  var APP = {
    SAVE_KEY: 'villagepub-save',
    state: null,
    cfg: null,
    app: {
      screen: 'setup',
      wizard: null,
      willOpen: false,
      rolesHidden: false,
      namingMode: false,
      trialStage: null,
      trialNom: null,
      lastTrialResult: null,
      lastVictory: null,
      picker: null,
      seatOverlay: false,
      logsOpen: false,
      swapMode: false,
      swapSel: null,
      names: {},
      endReveal: null,
      timerDeadline: null
    }
  };

  function defaultCfg() {
    var keys = E.PRESETS ? Object.keys(E.PRESETS) : ['p1'];
    var preset = E.PRESETS[keys[0]] || { town: [], mafia: [], neutral: [] };
    var ratio = (E.RATIO_TABLE && E.RATIO_TABLE[8]) || { town: 5, mafia: 2, neutral: 1 };
    return {
      playerCount: 8,
      presetId: keys[0],
      houseRules: { noKillN1: false, noLynchD1: false, classicReveal: false },
      layout: (E.SEAT_LAYOUTS && E.SEAT_LAYOUTS[0]) || 'circle',
      teamCounts: { town: ratio.town, mafia: ratio.mafia, neutral: ratio.neutral },
      civilians: null,
      deckConfig: {
        town: (preset.town || []).slice(),
        mafia: (preset.mafia || []).slice(),
        neutral: (preset.neutral || []).slice()
      }
    };
  }

  function mergeCfg(base, saved) {
    var out = JSON.parse(JSON.stringify(base));
    if (saved.playerCount) out.playerCount = saved.playerCount;
    if (saved.presetId) out.presetId = saved.presetId;
    if (saved.houseRules) out.houseRules = Object.assign({}, out.houseRules, saved.houseRules);
    if (saved.layout) out.layout = saved.layout;
    if (saved.teamCounts && saved.teamCounts.town != null) {
      out.teamCounts = { town: saved.teamCounts.town, mafia: saved.teamCounts.mafia, neutral: saved.teamCounts.neutral };
    } else {
      var ratio = (E.RATIO_TABLE && E.RATIO_TABLE[out.playerCount]) || { town: 0, mafia: 0, neutral: 0 };
      out.teamCounts = { town: ratio.town, mafia: ratio.mafia, neutral: ratio.neutral };
    }
    if (saved.civilians != null) out.civilians = saved.civilians;
    if (saved.deckConfig) {
      out.deckConfig = {
        town: (saved.deckConfig.town || []).slice(),
        mafia: (saved.deckConfig.mafia || []).slice(),
        neutral: (saved.deckConfig.neutral || []).slice()
      };
    }
    return out;
  }

  function teamCountsObj() {
    return APP.cfg.teamCounts || (E.RATIO_TABLE && E.RATIO_TABLE[APP.cfg.playerCount]) || { town: 0, mafia: 0, neutral: 0 };
  }

  function teamLabel(t) {
    return { TOWN: 'Town', MAFIA: 'Mafia', NEUTRAL: 'Neutral' }[t] || t;
  }

  function deckList(team) { return APP.cfg.deckConfig[String(team).toLowerCase()]; }

  function teamAddAllowed(team) {
    var tc = teamCountsObj();
    var key = team.toLowerCase();
    var slots = tc[key] || 0;
    var list = deckList(team);
    if (team === 'TOWN') {
      var civs = APP.cfg.civilians == null ? 0 : Math.max(0, Math.min(slots, Number(APP.cfg.civilians) || 0));
      return list.length < Math.max(0, slots - civs);
    }
    return list.length < slots;
  }

  function townLeftoverCivilians() {
    var slots = teamCountsObj().town || 0;
    return Math.max(0, slots - Math.min(deckList('TOWN').length, slots));
  }

  function resetAppFlags() {
    APP.app.wizard = null;
    APP.app.willOpen = false;
    APP.app.rolesHidden = false;
    APP.app.namingMode = false;
    APP.app.trialStage = null;
    APP.app.trialNom = null;
    APP.app.lastTrialResult = null;
    APP.app.lastVictory = null;
    APP.app.picker = null;
    APP.app.seatOverlay = false;
    APP.app.logsOpen = false;
    APP.app.swapMode = false;
    APP.app.swapSel = null;
    APP.app.names = {};
    APP.app.endReveal = null;
  }

  APP.defaultCfg = defaultCfg;
  APP.mergeCfg = mergeCfg;
  APP.teamCountsObj = teamCountsObj;
  APP.teamLabel = teamLabel;
  APP.deckList = deckList;
  APP.teamAddAllowed = teamAddAllowed;
  APP.townLeftoverCivilians = townLeftoverCivilians;
  APP.resetAppFlags = resetAppFlags;
  APP.init = function () {
    APP.state = null;
    APP.cfg = APP.defaultCfg();
  };

  window.APP = APP;
})();

</script>
<script>
'use strict';

(function () {
  var E = window.VillageEngine || {};
  var APP = window.APP;

  function save() {
    var app = APP.app;
    var ui = {
      rolesHidden: app.rolesHidden,
      willOpen: app.willOpen,
      namingMode: app.namingMode,
      wizardIdx: app.wizard ? app.wizard.idx : 0
    };
    var payload = { cfg: APP.cfg, ui: ui, game: APP.state ? E.serialize(APP.state) : null };
    try {
      localStorage.setItem(APP.SAVE_KEY, JSON.stringify(payload));
    } catch (e) { }
  }

  function renderResumeBanner() {
    var host = APP.el('resume-banner');
    var data = null;
    try { data = JSON.parse(localStorage.getItem(APP.SAVE_KEY) || 'null'); } catch (e) { data = null; }
    if (data && data.game) {
      host.innerHTML = '<div class="resume-banner"><strong>Saved game found</strong>' +
        '<span class="muted small">A game is in progress. Resume it or start fresh.</span>' +
        '<div class="btn-row"><button class="btn btn-primary" data-action="resume-game">Resume</button>' +
        '<button class="btn" data-action="new-game">New Game</button></div></div>';
    } else {
      host.innerHTML = '';
    }
  }

  function afterMutation() {
    save();
    APP.renderScreen(APP.app.screen);
  }

  function loadSave() {
    var data = null;
    try { data = JSON.parse(localStorage.getItem(APP.SAVE_KEY) || 'null'); } catch (e) { data = null; }
    return data;
  }

  function clearSave() {
    try { localStorage.removeItem(APP.SAVE_KEY); } catch (e) { }
  }

  APP.save = save;
  APP.renderResumeBanner = renderResumeBanner;
  APP.afterMutation = afterMutation;
  APP.loadSave = loadSave;
  APP.clearSave = clearSave;
})();

</script>
<script>
'use strict';

(function () {
  var UI = window.UI || {};
  var APP = window.APP;

  function el(id) { return document.getElementById(id); }

  function renderSetupOnly() {
    el('setup-body').innerHTML = UI.renderSetup(APP.cfg);
    APP.renderResumeBanner();
  }

  function renderGame() {
    var out = UI.renderGame(APP.state, APP.cfg, APP.app);
    el('game-header').innerHTML = UI.renderGameHeader(APP.state, APP.cfg, APP.app);
    el('game-body').innerHTML = out.body;
    el('game-bar').innerHTML = out.bar;
    startTimers();
  }

  function renderScreen(name) {
    if (!APP.state) {
      renderSetupOnly();
      return;
    }
    if (name === 'setup') renderSetupOnly();
    else if (name === 'seats') el('seats-body').innerHTML = UI.renderSeats(APP.state, APP.cfg, APP.app);
    else if (name === 'game') renderGame();
    else if (name === 'end') el('end-body').innerHTML = UI.renderEnd(APP.state, APP.cfg, APP.app);
  }

  function goto(name) {
    APP.app.screen = name;
    document.querySelectorAll('.screen').forEach(function (s) {
      s.classList.toggle('active', s.getAttribute('data-screen') === name);
    });
    renderScreen(name);
    window.scrollTo(0, 0);
  }

  function refreshSetup() {
    APP.save();
    renderSetupOnly();
  }

  var timerId = null;

  function clearTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
  }

  function onTimerDone(kind) {
    APP.app.timerDeadline = null;
    if (kind === 'will') {
      APP.app.willOpen = false;
      UI.toast('Pencils down! Wills are locked.');
      APP.afterMutation();
    } else {
      UI.toast('Time is up.');
    }
  }

  function startTimers() {
    clearTimer();
    var t = document.querySelector('[data-timer-seconds]');
    if (!t) { APP.app.timerDeadline = null; return; }
    var total = Number(t.getAttribute('data-timer-seconds')) || 0;
    var kind = t.getAttribute('data-timer-kind') || 'step';
    if (APP.app.timerDeadline == null) APP.app.timerDeadline = Date.now() + total * 1000;
    var tick = function () {
      var remain = Math.max(0, Math.round((APP.app.timerDeadline - Date.now()) / 1000));
      t.textContent = remain + 's';
      if (remain <= 0) {
        clearTimer();
        APP.app.timerDeadline = null;
        onTimerDone(kind);
      }
    };
    tick();
    if (t.textContent !== '0s') timerId = setInterval(tick, 1000);
  }

  APP.el = el;
  APP.goto = goto;
  APP.renderScreen = renderScreen;
  APP.renderSetupOnly = renderSetupOnly;
  APP.renderGame = renderGame;
  APP.refreshSetup = refreshSetup;
  APP.startTimers = startTimers;
  APP.clearTimer = clearTimer;
  APP.onTimerDone = onTimerDone;
})();

</script>
<script>
'use strict';

(function () {
  var E = window.VillageEngine || {};
  var UI = window.UI || {};
  var APP = window.APP;

  function selectPreset(id) {
    APP.cfg.presetId = id;
    var p = E.PRESETS[id];
    if (p) {
      APP.cfg.deckConfig = {
        town: (p.town || []).slice(),
        mafia: (p.mafia || []).slice(),
        neutral: (p.neutral || []).slice()
      };
    }
  }

  function addRole(team) {
    if (!APP.teamAddAllowed(team)) {
      var tc = APP.teamCountsObj();
      var slots = tc[String(team).toLowerCase()] || 0;
      var reason;
      if (team === 'TOWN' && APP.cfg.civilians != null && APP.cfg.civilians > 0) {
        var free = Math.max(0, slots - Math.min(slots, Number(APP.cfg.civilians) || 0));
        reason = 'Only ' + free + ' named Town slot' + (free === 1 ? '' : 's') + ' remain (' +
          APP.cfg.civilians + ' civilian' + (APP.cfg.civilians === 1 ? '' : 's') + ' reserved).';
      } else {
        reason = 'All ' + slots + ' ' + APP.teamLabel(team) + ' slot' + (slots === 1 ? '' : 's') + ' are assigned.';
      }
      UI.toast(reason);
      return;
    }
    var sel = APP.el('add-' + team);
    if (!sel) return;
    var id = sel.value;
    var list = APP.deckList(team);
    if (list.indexOf(id) === -1) list.push(id);
  }

  function removeRole(team, index) {
    var list = APP.deckList(team);
    if (index >= 0 && index < list.length) list.splice(index, 1);
  }

  function moveRole(team, index, dir) {
    var list = APP.deckList(team);
    var j = index + dir;
    if (index < 0 || j < 0 || index >= list.length || j >= list.length) return;
    var tmp = list[index];
    list[index] = list[j];
    list[j] = tmp;
  }

  function teamInc(team) {
    var tc = APP.teamCountsObj();
    var total = (tc.town || 0) + (tc.mafia || 0) + (tc.neutral || 0);
    if (total >= APP.cfg.playerCount) {
      UI.toast('Team totals cannot exceed the player count (' + APP.cfg.playerCount + '). Lower another team first.');
      return;
    }
    APP.cfg.teamCounts = { town: tc.town, mafia: tc.mafia, neutral: tc.neutral };
    APP.cfg.teamCounts[String(team).toLowerCase()] += 1;
    APP.refreshSetup();
  }

  function teamDec(team) {
    var tc = APP.teamCountsObj();
    var key = String(team).toLowerCase();
    if ((tc[key] || 0) <= 0) return;
    APP.cfg.teamCounts = { town: tc.town, mafia: tc.mafia, neutral: tc.neutral };
    APP.cfg.teamCounts[key] -= 1;
    APP.refreshSetup();
  }

  function civInc() {
    var slots = APP.teamCountsObj().town || 0;
    var cur = APP.cfg.civilians == null ? APP.townLeftoverCivilians() : Number(APP.cfg.civilians) || 0;
    if (cur >= slots) {
      UI.toast('Civilian count cannot exceed the Town slot count (' + slots + ').');
      return;
    }
    APP.cfg.civilians = cur + 1;
    APP.refreshSetup();
  }

  function civDec() {
    var cur = APP.cfg.civilians == null ? APP.townLeftoverCivilians() : Number(APP.cfg.civilians) || 0;
    if (cur <= 0) {
      UI.toast('Civilian count cannot go below zero.');
      return;
    }
    APP.cfg.civilians = cur - 1;
    APP.refreshSetup();
  }

  function startGame() {
    var tc = APP.cfg.teamCounts;
    if (tc) {
      var total = (tc.town || 0) + (tc.mafia || 0) + (tc.neutral || 0);
      if (total !== APP.cfg.playerCount) {
        UI.toast('Team totals must equal the player count (' + APP.cfg.playerCount + '), currently ' + total + '.');
        return;
      }
    }
    try {
      APP.state = E.createGame({
        playerCount: APP.cfg.playerCount,
        presetId: APP.cfg.presetId,
        houseRules: APP.cfg.houseRules,
        town: APP.cfg.deckConfig.town,
        mafia: APP.cfg.deckConfig.mafia,
        neutral: APP.cfg.deckConfig.neutral,
        teamCounts: tc || undefined,
        civilians: APP.cfg.civilians == null ? undefined : APP.cfg.civilians
      });
      APP.resetAppFlags();
      APP.save();
      APP.goto('seats');
    } catch (e) {
      UI.toast('Setup error: ' + e.message);
    }
  }

  function newGame() {
    APP.clearSave();
    APP.state = null;
    APP.cfg = APP.defaultCfg();
    APP.resetAppFlags();
    APP.goto('setup');
  }

  function resumeGame() {
    var data = APP.loadSave();
    if (!data || !data.game) { UI.toast('No saved game found.'); return; }
    try {
      APP.state = E.deserialize(data.game);
      if (data.cfg) APP.cfg = APP.mergeCfg(APP.cfg, data.cfg);
      APP.app.rolesHidden = !!(data.ui && data.ui.rolesHidden);
      APP.app.willOpen = false;
      APP.app.namingMode = false;
      APP.app.lastTrialResult = null;
      APP.app.lastVictory = null;
      APP.app.picker = null;
      APP.app.seatOverlay = false;
      APP.app.swapMode = false;
      APP.app.swapSel = null;
      APP.app.endReveal = null;
      if (APP.state.phase === 'MORNING') APP.app.willOpen = !!(data.ui && data.ui.willOpen);
      if (APP.state.phase === 'NIGHT') {
        APP.app.wizard = {
          steps: E.getNightSteps(APP.state),
          idx: Math.min((data.ui && data.ui.wizardIdx) || 0, Math.max(0, E.getNightSteps(APP.state).length - 1)),
          actor: null,
          pending: null
        };
      } else {
        APP.app.wizard = null;
      }
      var screen = { SETUP: 'setup', SEATS: 'seats', NIGHT: 'game', MORNING: 'game', DAY: 'game', END: 'end' }[APP.state.phase] || 'setup';
      APP.goto(screen);
      UI.toast('Game restored.');
    } catch (e) {
      UI.toast('Could not restore save.');
    }
  }

  APP.selectPreset = selectPreset;
  APP.addRole = addRole;
  APP.removeRole = removeRole;
  APP.moveRole = moveRole;
  APP.teamInc = teamInc;
  APP.teamDec = teamDec;
  APP.civInc = civInc;
  APP.civDec = civDec;
  APP.startGame = startGame;
  APP.newGame = newGame;
  APP.resumeGame = resumeGame;
})();

</script>
<script>
'use strict';

(function () {
  var E = window.VillageEngine || {};
  var UI = window.UI || {};
  var APP = window.APP;

  function playerBySeat(seat) {
    return (APP.state.players || []).find(function (p) { return String(p.seat) === String(seat); }) || null;
  }

  function dealRoles() {
    var names = [];
    for (var s = 1; s <= (APP.state.playerCount || APP.cfg.playerCount); s++) {
      names.push({ seat: s, name: (APP.app.names[s] || '').trim() || ('Player ' + s) });
    }
    E.setPlayerNames(APP.state, names);
    E.dealRoles(APP.state);
    APP.app.namingMode = false;
    APP.afterMutation();
  }

  function swapSelect(seat) {
    if (!APP.app.swapMode) return;
    var p = playerBySeat(seat);
    if (!p) return;
    if (APP.app.swapSel == null) {
      APP.app.swapSel = Number(seat);
      APP.afterMutation();
      return;
    }
    if (Number(APP.app.swapSel) === Number(seat)) {
      APP.app.swapSel = null;
      APP.afterMutation();
      return;
    }
    var a = playerBySeat(APP.app.swapSel);
    try {
      E.swapRoles(APP.state, a.id, p.id);
      APP.app.swapMode = false;
      APP.app.swapSel = null;
      UI.toast('Roles swapped.');
      APP.afterMutation();
    } catch (e) {
      UI.toast(e.message);
    }
  }

  function editNames() {
    APP.app.names = {};
    (APP.state.players || []).forEach(function (p) {
      APP.app.names[p.seat] = p.name || '';
    });
    APP.app.namingMode = true;
    APP.save();
    APP.renderScreen('seats');
  }

  function beginNight() {
    APP.state.phase = 'NIGHT';
    APP.app.namingMode = false;
    APP.app.wizard = { steps: E.getNightSteps(APP.state), idx: 0, actor: null, pending: null };
    APP.afterMutation();
    APP.goto('game');
  }

  APP.dealRoles = dealRoles;
  APP.swapSelect = swapSelect;
  APP.editNames = editNames;
  APP.beginNight = beginNight;
})();

</script>
<script>
'use strict';

(function () {
  var E = window.VillageEngine || {};
  var UI = window.UI || {};
  var APP = window.APP;

  function findPlayer(id) {
    var out = null;
    (APP.state.players || []).forEach(function (p) {
      if (String(p.id) === String(id)) out = p;
    });
    return out;
  }

  function resolveId(id) {
    var p = findPlayer(id);
    return p ? p.id : id;
  }

  function roleHolder(roleId) {
    var out = null;
    (APP.state.players || []).forEach(function (p) {
      if (p.isAlive && p.assignedRole === roleId) out = p;
    });
    return out;
  }

  function wiz() { return APP.app.wizard; }

  function curStep() { return wiz().steps[Math.min(wiz().idx, wiz().steps.length - 1)]; }

  function recordWizard(role, playerId, targetId, extra) {
    var step = curStep();
    var action = {
      position: step.position,
      roleId: role,
      playerId: playerId,
      targetId: targetId
    };
    if (extra) action.extra = extra;
    E.recordNightAction(APP.state, action);
    APP.afterMutation();
  }

  function wizNext() {
    wiz().idx = Math.min(wiz().idx + 1, Math.max(0, wiz().steps.length - 1));
    wiz().actor = null;
    wiz().pending = null;
    APP.afterMutation();
  }

  function wizBack() {
    wiz().idx = Math.max(0, wiz().idx - 1);
    wiz().actor = null;
    wiz().pending = null;
    APP.afterMutation();
  }

  function wizActor(role, playerId) {
    var p = findPlayer(playerId);
    wiz().actor = { role: role, player: p ? p.id : playerId };
    wiz().pending = null;
    APP.afterMutation();
  }

  function wizActorBack() {
    wiz().actor = null;
    wiz().pending = null;
    APP.afterMutation();
  }

  function wizTarget(targetId) {
    var w = wiz();
    var role = w.actor.role;
    var pid = w.actor.player;
    if (targetId === '__none__') {
      recordWizard(role, pid, null, undefined);
      w.actor = null;
      w.pending = null;
      APP.afterMutation();
      return;
    }
    targetId = resolveId(targetId);
    if (role === 'witch') {
      if (!w.pending || !w.pending.control) {
        w.pending = { control: targetId };
        APP.afterMutation();
        return;
      }
      recordWizard(role, pid, w.pending.control, { controlRedirect: targetId });
    } else if (role === 'jailor') {
      w.pending = { jail: targetId };
      APP.afterMutation();
      return;
    } else if (role === 'forger') {
      w.pending = { forge: targetId };
      APP.afterMutation();
      return;
    } else {
      recordWizard(role, pid, targetId, undefined);
    }
    w.actor = null;
    w.pending = null;
    APP.afterMutation();
  }

  function wizAlert(alerting) {
    var w = wiz();
    recordWizard('veteran', w.actor.player, w.actor.player, { alert: alerting });
    w.actor = null;
    w.pending = null;
    APP.afterMutation();
  }

  function wizJailorDecision(decision) {
    var w = wiz();
    recordWizard('jailor', w.actor.player, w.pending.jail, { jailorDecision: decision });
    w.actor = null;
    w.pending = null;
    APP.afterMutation();
  }

  function wizForgeConfirm() {
    var w = wiz();
    var txtInput = APP.el('forge-will');
    var txt = txtInput ? txtInput.value : '';
    recordWizard('forger', w.actor.player, w.pending.forge, { will: txt });
    w.actor = null;
    w.pending = null;
    APP.afterMutation();
  }

  function resolveNight() {
    try {
      E.resolveNight(APP.state);
      APP.state.phase = 'MORNING';
      APP.app.wizard = null;
      APP.app.willOpen = true;
      APP.app.timerDeadline = null;
      APP.afterMutation();
      checkEnd();
    } catch (e) {
      UI.toast('Night error: ' + e.message);
    }
  }

  function beginDay() {
    try {
      E.beginDay(APP.state);
      APP.app.willOpen = false;
      APP.afterMutation();
      checkEnd();
    } catch (e) {
      UI.toast('Day error: ' + e.message);
    }
  }

  function checkEnd() {
    if (APP.state.phase === 'END' || APP.state.winner) {
      finish(APP.app.lastVictory);
      return true;
    }
    var v = E.checkVictory(APP.state);
    if (v) {
      finish(v);
      return true;
    }
    return false;
  }

  function finish(v) {
    APP.app.lastVictory = v || APP.app.lastVictory;
    if (v && v.winner) APP.state.winner = v.winner;
    try {
      if (APP.state.phase !== 'END') {
        var er = E.endGame(APP.state);
        APP.app.endReveal = er && er.reveal ? er.reveal : null;
      }
    } catch (e) { }
    APP.state.phase = 'END';
    APP.app.wizard = null;
    APP.afterMutation();
    APP.goto('end');
  }

  function startTrial(accusedId) {
    try {
      E.startTrial(APP.state, resolveId(accusedId), resolveId(APP.app.trialNom));
      APP.app.trialStage = null;
      APP.app.trialNom = null;
      APP.app.lastTrialResult = null;
      APP.afterMutation();
    } catch (e) {
      UI.toast('Trial error: ' + e.message);
    }
  }

  function castVote(btn) {
    if (!APP.state.trial || !APP.state.trial.active) return;
    try {
      E.castVote(APP.state, {
        voterId: resolveId(btn.getAttribute('data-voter')),
        verdict: btn.getAttribute('data-verdict'),
        ghostToken: btn.getAttribute('data-ghost') === '1'
      });
      APP.afterMutation();
    } catch (e) {
      UI.toast(e.message);
    }
  }

  function resolveTrial() {
    try {
      var res = E.resolveTrial(APP.state);
      APP.app.lastTrialResult = res || {};
      if (APP.state.trial && APP.state.trial.active) APP.state.trial.active = false;
      APP.afterMutation();
      checkEnd();
    } catch (e) {
      UI.toast('Trial error: ' + e.message);
    }
  }

  function openDayAbility(ability) {
    if (ability === 'mayor') {
      var may = roleHolder('mayor');
      if (may) doDayAbility('mayor', null);
      return;
    }
    var titles = {
      vigilante: 'Vigilante - choose a target',
      deputy: 'Deputy - choose a target'
    };
    APP.app.picker = {
      title: titles[ability] || ability,
      sub: 'Pick a living player.',
      ability: ability
    };
    APP.afterMutation();
  }

  function doDayAbility(ability, targetId) {
    APP.app.picker = null;
    try {
      if (ability === 'vigilante') {
        var vig = roleHolder('vigilante');
        if (vig) E.vigilanteShoot(APP.state, vig.id, resolveId(targetId));
      } else if (ability === 'deputy') {
        var dep = roleHolder('deputy');
        if (dep) E.deputyShoot(APP.state, dep.id, resolveId(targetId));
      } else if (ability === 'mayor') {
        var may = roleHolder('mayor');
        if (may) E.mayorReveal(APP.state, may.id);
      }
      APP.afterMutation();
      checkEnd();
    } catch (e) {
      UI.toast(e.message);
      APP.afterMutation();
    }
  }

  function endDay() {
    if (checkEnd()) return;
    APP.state.phase = 'NIGHT';
    APP.app.trialStage = null;
    APP.app.trialNom = null;
    APP.app.lastTrialResult = null;
    APP.app.picker = null;
    APP.app.wizard = { steps: E.getNightSteps(APP.state), idx: 0, actor: null, pending: null };
    APP.afterMutation();
    APP.goto('game');
  }

  APP.wizNext = wizNext;
  APP.wizBack = wizBack;
  APP.wizActor = wizActor;
  APP.wizActorBack = wizActorBack;
  APP.wizTarget = wizTarget;
  APP.wizAlert = wizAlert;
  APP.wizJailorDecision = wizJailorDecision;
  APP.wizForgeConfirm = wizForgeConfirm;
  APP.resolveNight = resolveNight;
  APP.beginDay = beginDay;
  APP.checkEnd = checkEnd;
  APP.finish = finish;
  APP.startTrial = startTrial;
  APP.castVote = castVote;
  APP.resolveTrial = resolveTrial;
  APP.openDayAbility = openDayAbility;
  APP.doDayAbility = doDayAbility;
  APP.endDay = endDay;
})();

</script>
<script>
'use strict';

(function () {
  var E = window.VillageEngine || {};
  var UI = window.UI || {};
  var APP = window.APP;

  function dispatch(action, btn) {
    var cfg = APP.cfg;
    var state = APP.state;
    var app = APP.app;
    switch (action) {
      case 'count-dec':
        if (cfg.playerCount > 6) {
          cfg.playerCount--;
          var r1 = (E.RATIO_TABLE && E.RATIO_TABLE[cfg.playerCount]) || { town: 0, mafia: 0, neutral: 0 };
          cfg.teamCounts = { town: r1.town, mafia: r1.mafia, neutral: r1.neutral };
          APP.refreshSetup();
        }
        break;
      case 'count-inc':
        if (cfg.playerCount < 15) {
          cfg.playerCount++;
          var r2 = (E.RATIO_TABLE && E.RATIO_TABLE[cfg.playerCount]) || { town: 0, mafia: 0, neutral: 0 };
          cfg.teamCounts = { town: r2.town, mafia: r2.mafia, neutral: r2.neutral };
          APP.refreshSetup();
        }
        break;
      case 'preset-select':
        APP.selectPreset(btn.getAttribute('data-preset'));
        APP.refreshSetup();
        break;
      case 'rule-toggle': {
        var rule = btn.getAttribute('data-rule');
        cfg.houseRules[rule] = !cfg.houseRules[rule];
        APP.refreshSetup();
        break;
      }
      case 'layout-select':
        cfg.layout = btn.getAttribute('data-layout');
        APP.refreshSetup();
        break;
      case 'deck-add':
        APP.addRole(btn.getAttribute('data-team'));
        APP.refreshSetup();
        break;
      case 'team-count-inc':
        APP.teamInc(btn.getAttribute('data-team'));
        break;
      case 'team-count-dec':
        APP.teamDec(btn.getAttribute('data-team'));
        break;
      case 'civ-inc':
        APP.civInc();
        break;
      case 'civ-dec':
        APP.civDec();
        break;
      case 'deck-remove':
        APP.removeRole(btn.getAttribute('data-team'), Number(btn.getAttribute('data-index')));
        APP.refreshSetup();
        break;
      case 'deck-up':
        APP.moveRole(btn.getAttribute('data-team'), Number(btn.getAttribute('data-index')), -1);
        APP.refreshSetup();
        break;
      case 'deck-down':
        APP.moveRole(btn.getAttribute('data-team'), Number(btn.getAttribute('data-index')), 1);
        APP.refreshSetup();
        break;
      case 'start-game':
        APP.startGame();
        break;
      case 'resume-game':
        APP.resumeGame();
        break;
      case 'new-game':
        APP.newGame();
        break;

      case 'deal-roles':
        APP.dealRoles();
        break;
      case 'redeal':
        try { E.redeal(state); APP.afterMutation(); } catch (e) { UI.toast(e.message); }
        break;
      case 'edit-names':
        APP.editNames();
        break;
      case 'toggle-roles':
        app.rolesHidden = !app.rolesHidden;
        APP.save();
        APP.renderScreen('seats');
        break;
      case 'witch-side':
        state.witchSide = btn.getAttribute('data-side') === 'TOWN' ? 'TOWN' : 'MAFIA';
        APP.afterMutation();
        break;
      case 'begin-night':
        APP.beginNight();
        break;
      case 'goto-setup':
        APP.goto('setup');
        break;
      case 'swap-mode':
        app.swapMode = !app.swapMode;
        if (!app.swapMode) app.swapSel = null;
        APP.afterMutation();
        break;
      case 'swap-cancel':
        app.swapMode = false;
        app.swapSel = null;
        APP.afterMutation();
        break;
      case 'swap-select':
        APP.swapSelect(btn.getAttribute('data-seat'));
        break;

      case 'wizard-next':
        APP.wizNext();
        break;
      case 'wizard-back':
        APP.wizBack();
        break;
      case 'wizard-skip':
        APP.wizNext();
        break;
      case 'wizard-actor':
        APP.wizActor(btn.getAttribute('data-role'), btn.getAttribute('data-player'));
        break;
      case 'wizard-actor-back':
        APP.wizActorBack();
        break;
      case 'wizard-target':
        APP.wizTarget(btn.getAttribute('data-target'));
        break;
      case 'wizard-alert':
        APP.wizAlert(btn.getAttribute('data-alert') === 'true');
        break;
      case 'wizard-decision':
        APP.wizJailorDecision(btn.getAttribute('data-decision'));
        break;
      case 'wizard-forge':
        APP.wizForgeConfirm();
        break;
      case 'resolve-night':
        APP.resolveNight();
        break;
      case 'pencils-down':
        app.willOpen = false;
        app.timerDeadline = null;
        UI.toast('Pencils down! Wills are locked.');
        APP.afterMutation();
        break;
      case 'begin-day':
        APP.beginDay();
        break;

      case 'start-trial':
        app.trialStage = 'nominator';
        app.lastTrialResult = null;
        APP.afterMutation();
        break;
      case 'pick-nom':
        app.trialNom = btn.getAttribute('data-target');
        app.trialStage = 'accused';
        APP.afterMutation();
        break;
      case 'pick-acc':
        APP.startTrial(btn.getAttribute('data-target'));
        break;
      case 'cast-vote':
        APP.castVote(btn);
        break;
      case 'resolve-trial':
        APP.resolveTrial();
        break;
      case 'clear-trial':
        app.lastTrialResult = null;
        app.trialStage = null;
        APP.afterMutation();
        break;

      case 'day-ability':
        APP.openDayAbility(btn.getAttribute('data-ability'));
        break;
      case 'pick-day-target':
        APP.doDayAbility(btn.getAttribute('data-ability'), btn.getAttribute('data-target'));
        break;
      case 'picker-cancel':
        app.picker = null;
        APP.afterMutation();
        break;
      case 'end-day':
        APP.endDay();
        break;

      case 'toggle-seat-overlay':
        app.seatOverlay = !app.seatOverlay;
        APP.afterMutation();
        break;
      case 'toggle-logs':
        app.logsOpen = !app.logsOpen;
        APP.afterMutation();
        break;
      default:
        break;
    }
  }

  document.addEventListener('click', function (ev) {
    var btn = ev.target && ev.target.closest ? ev.target.closest('[data-action]') : null;
    if (!btn) return;
    var action = btn.getAttribute('data-action');
    if (action === 'will-input') return;
    dispatch(action, btn);
  });

  document.addEventListener('input', function (ev) {
    var t = ev.target;
    if (!t || !t.getAttribute) return;
    if (t.classList && t.classList.contains('seat-name-input')) {
      APP.app.names[Number(t.getAttribute('data-seat'))] = t.value;
      return;
    }
    if (t.getAttribute('data-action') === 'will-input') {
      if (APP.state && APP.state.phase === 'MORNING' && APP.app.willOpen) {
        try {
          E.updateWill(APP.state, t.getAttribute('data-player'), t.value);
          APP.save();
        } catch (e) { }
      }
    }
  });
})();

</script>
<script>
'use strict';

(function () {
  var APP = window.APP;
  if ('serviceWorker' in navigator && location.protocol.indexOf('https') === 0) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
  APP.init();
  APP.goto('setup');
})();

</script>
