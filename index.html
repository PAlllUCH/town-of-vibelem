<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="description" content="Village Pub moderator assistant">
<title>Village Pub - Moderator Assistant</title>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="styles/setup.css">
<link rel="stylesheet" href="styles/seats.css">
<link rel="stylesheet" href="styles/game.css">
<link rel="stylesheet" href="styles/end.css">
</head>
<body>
<div class="app">

  <header class="app-header">
    <h1>Village Pub</h1>
    <span class="app-sub">Moderator Assistant</span>
  </header>

  <section class="screen" data-screen="setup">
    <div id="resume-banner"></div>
    <div id="setup-body"></div>
  </section>

  <section class="screen" data-screen="seats">
    <div id="seats-body"></div>
  </section>

  <section class="screen" data-screen="game">
    <div id="game-header"></div>
    <div id="game-body"></div>
    <nav id="game-bar" class="bottom-bar" aria-label="Game actions"></nav>
  </section>

  <section class="screen" data-screen="end">
    <div id="end-body"></div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

</div>
<script src="js/engine/00-namespace.js"></script>
<script src="js/engine/01-roles.js"></script>
<script src="js/engine/02-presets.js"></script>
<script src="js/engine/03-deck.js"></script>
<script src="js/engine/04-state.js"></script>
<script src="js/engine/05-night-steps.js"></script>
<script src="js/engine/06-night-actions.js"></script>
<script src="js/engine/07-night-resolution.js"></script>
<script src="js/engine/08-ghosts.js"></script>
<script src="js/engine/09-day.js"></script>
<script src="js/engine/10-victory.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/setup.js"></script>
<script src="js/ui/seats.js"></script>
<script src="js/ui/wizard.js"></script>
<script src="js/ui/day.js"></script>
<script src="js/ui/end.js"></script>
<script src="js/app/config.js"></script>
<script src="js/app/persistence.js"></script>
<script src="js/app/router.js"></script>
<script src="js/app/actions-setup.js"></script>
<script src="js/app/actions-seats.js"></script>
<script src="js/app/actions-game.js"></script>
<script src="js/app/actions.js"></script>
<script src="js/app.js"></script>
</body>
</html>
